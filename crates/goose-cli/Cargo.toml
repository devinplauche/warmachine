[package]
name = "goose-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[lints]
workspace = true

[[bin]]
name = "warmachine"
path = "src/main.rs"

[[bin]]
name = "generate_manpages"
path = "src/bin/generate_manpages.rs"

[[bin]]
name = "mcp_conformance_driver"
path = "src/bin/mcp_conformance_driver.rs"

[dependencies]
clap_mangen = { version = "0.3", default-features = false }
warmachine = { path = "../goose", default-features = false }
agent-client-protocol = { workspace = true, features = ["unstable"], optional = true }
goose-mcp = { path = "../goose-mcp", default-features = false, optional = true }
goose-providers = { path = "../goose-providers", default-features = false }
goose-roaming = { path = "../goose-roaming", optional = true }
rmcp = { workspace = true }
clap = { workspace = true }
cliclack = { version = "0.5", default-features = false }
console = { version = "0.16", default-features = false, features = ["std"] }
unicode-segmentation = { version = "1.12", default-features = false }
dotenvy = { workspace = true }
bat = { version = "0.26", default-features = false, features = ["regex-onig"] }
anyhow = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
strum = { workspace = true }
strsim = "0.11"
tempfile = { workspace = true }
etcetera = { workspace = true }
rand = { workspace = true }
rustyline = { version = "18", default-features = false, features = ["custom-bindings", "with-dirs", "with-file-history"] }
tracing = { workspace = true }
chrono = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json", "time"] }
shlex = { version = "2.0", default-features = false, features = ["std"] }
async-trait = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
tar = { version = "0.4.46", default-features = false }
reqwest = { workspace = true, features = ["blocking"] }
zip = { workspace = true }
bzip2 = { version = "0.6", default-features = false, features = ["default"] }
webbrowser = { workspace = true }
indicatif = { version = "0.18", default-features = false }
tokio-util = { workspace = true, features = ["compat", "rt"] }
anstream = { version = "1", default-features = false, features = ["auto"] }
open = { version = "5", default-features = false }
url = { workspace = true }
urlencoding = { workspace = true }
clap_complete = { version = "4", default-features = false }
comfy-table = { version = "8", default-features = false }
sha2 = { workspace = true }
sigstore-verify = { version = "0.11", default-features = false, optional = true }
snap = { workspace = true, optional = true }
axum.workspace = true
axum-server = { workspace = true, optional = true }
clap_complete_nushell = { version = "4", default-features = false }
qrcode = { version = "0.14.1", optional = true }
fs2 = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
anstream = { version = "1", default-features = false, features = ["wincon"] }
ntapi = { version = "0.4.3", default-features = false, features = ["user"] }
winapi = { workspace = true, features = [
    "consoleapi",
    "processenv",
    "winbase",
    "wincon",
] }

[target."cfg(unix)".dependencies]
libc = { version = "0.2.182", default-features = false, features = ["std"] }

[features]
default = [
    "code-mode",
    "tree-sitter",
    "local-inference",
    "aws-providers",
    "telemetry",
    "nostr",
    "otel",
    "rustls-tls",
    "live-voice",
    "system-keyring",
    "update",
    "bundled-mcp",
    "scheduler",
    "platform-apps",
    "chat-recall",
    "acp-http",
]
roaming = ["dep:goose-roaming", "dep:qrcode", "dep:fs2", "dep:agent-client-protocol"]
code-mode = ["warmachine/code-mode"]
tree-sitter = ["warmachine/tree-sitter"]
live-voice = ["warmachine/live-voice"]
local-inference = ["warmachine/local-inference"]
aws-providers = ["warmachine/aws-providers"]
cuda = ["warmachine/cuda", "local-inference"]
vulkan = ["warmachine/vulkan", "local-inference"]
mlx = ["warmachine/mlx", "local-inference"]
telemetry = ["warmachine/telemetry"]
nostr = ["warmachine/nostr"]
otel = ["warmachine/otel"]
system-keyring = ["warmachine/system-keyring"]
update = ["dep:sigstore-verify", "dep:snap"]
bundled-mcp = ["dep:goose-mcp", "goose-mcp/bundled-mcp"]
scheduler = ["warmachine/scheduler"]
platform-apps = ["warmachine/platform-apps"]
chat-recall = ["warmachine/chat-recall"]
# On-prem builds must never self-update from the public internet: imply
# `disable-update` so `warmachine update` fails closed (see commands/update.rs).
onprem = ["warmachine/onprem", "disable-update"]
acp-http = ["warmachine/acp-http"]
portable-default = [
    "rustls-tls",
    "tree-sitter",
    "live-voice",
    "aws-providers",
    "telemetry",
    "otel",
    "bundled-mcp",
    "scheduler",
    "platform-apps",
    "chat-recall",
    "acp-http",
]
# disables the update command
disable-update = []
rustls-tls = [
    "dep:axum-server",
    "reqwest/rustls",
    "axum-server/tls-rustls",
    "sigstore-verify?/rustls",
    "warmachine/rustls-tls",
    "goose-mcp?/rustls-tls",
    "goose-providers/rustls-tls",
]
native-tls = [
    "dep:axum-server",
    "reqwest/native-tls",
    "axum-server/tls-openssl",
    "sigstore-verify?/native-tls",
    "warmachine/native-tls",
    "goose-mcp?/native-tls",
    "goose-providers/native-tls",
]
[dev-dependencies]
env-lock.workspace = true
tempfile = { workspace = true }
test-case = { workspace = true }
tokio = { workspace = true }

[package.metadata.cargo-machete]
ignored = [
    # Used only in windows
    "winapi",
]
