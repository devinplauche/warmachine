name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.filter.outputs.docs-only }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check for file changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # pin@v3
        id: filter
        with:
          filters: |
            docs-only:
              - 'documentation/**'
            code:
              - '!documentation/**'

  goose-acp-npm-packages:
    name: warmachine ACP npm packages
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install dependencies
        run: source bin/activate-hermit && pnpm --dir ui install --frozen-lockfile

      - name: Check npm versions
        run: source bin/activate-hermit && node ui/scripts/npm-versions.mjs check

      - name: Test goose-acp
        run: source bin/activate-hermit && pnpm --dir ui/goose-acp test

      - name: Pack npm packages
        run: |
          source bin/activate-hermit
          set -euo pipefail
          client_pack_dir="$RUNNER_TEMP/goose-acp-client"
          wrapper_pack_dir="$RUNNER_TEMP/goose-acp"
          mkdir -p "$client_pack_dir" "$wrapper_pack_dir"

          pnpm --dir ui/goose-acp-client pack --pack-destination "$client_pack_dir"
          pnpm --dir ui/goose-acp pack --pack-destination "$wrapper_pack_dir"

          wrapper_tarball=$(find "$wrapper_pack_dir" -name '*.tgz' -print -quit)
          tar -xzf "$wrapper_tarball" -C "$wrapper_pack_dir"
          node ui/scripts/npm-versions.mjs check-packed-wrapper \
            "$wrapper_pack_dir/package/package.json"

  rust-format:
    name: Check Rust Code Format
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false

      - name: Run cargo fmt
        run: cargo fmt --check

  rust-build-and-test:
    name: Build and Test Rust Project
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Repair stale v8 prebuilt marker
        run: .github/scripts/repair-v8-prebuilt.sh

      - name: Install Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y libdbus-1-dev gnome-keyring libxcb1-dev cmake golang-go

      - name: Build and Test
        run: |
          gnome-keyring-daemon --components=secrets --daemonize --unlock <<< 'foobar'
          export CARGO_INCREMENTAL=0
          cargo test --locked -- --skip scenario_tests::scenarios::tests
          cargo test --locked --jobs 1 scenario_tests::scenarios::tests
        working-directory: crates
        env:
          RUST_MIN_STACK: 8388608

  rust-build-lean:
    name: Build Lean ACP Binary
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: lean-acp

      - name: Build lean configuration and check its size budget
        run: |
          source ./bin/activate-hermit
          # use the non-hermit rust toolchain because the rust-cache action does not
          # play nicely with hermit-managed rust
          hermit uninstall rustup
          just check-lean-size

  goose-sdk-uniffi:
    name: Check goose-sdk UniFFI
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Install Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y libdbus-1-dev libxcb1-dev

      - name: Check UniFFI feature
        run: |
          export CARGO_INCREMENTAL=0
          cargo check -p goose-sdk --features uniffi --locked
          cargo test -p goose-sdk --features uniffi --locked
        env:
          RUST_MIN_STACK: 8388608

  kotlin-gdk-smoke-test:
    name: Test Kotlin GDK package
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/maven-sdk.yml
    with:
      publish: false
      smoke-test: true

  rust-build-and-test-tls:
    name: Build and Test TLS Backend (${{ matrix.tls-feature }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        tls-feature:
          - rustls-tls
          - native-tls
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Install Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y libdbus-1-dev gnome-keyring libxcb1-dev

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: ${{ matrix.tls-feature }}

      - name: Build and Test with ${{ matrix.tls-feature }}
        run: |
          gnome-keyring-daemon --components=secrets --daemonize --unlock <<< 'foobar'
          export CARGO_INCREMENTAL=0
          cargo test -p warmachine --no-default-features --features ${{ matrix.tls-feature }},code-mode,tree-sitter,live-voice,scheduler,platform-apps,chat-recall,acp-http,harness
          cargo test -p goose-providers --no-default-features --features ${{ matrix.tls-feature }},live-websocket
          cargo test -p goose-cli --no-default-features --features ${{ matrix.tls-feature }},code-mode,tree-sitter,live-voice,scheduler,platform-apps,chat-recall,acp-http,harness -- --skip scenario_tests::scenarios::tests
          cargo test -p goose-cli --no-default-features --features ${{ matrix.tls-feature }},code-mode,tree-sitter,live-voice,scheduler,platform-apps,chat-recall,acp-http,harness --jobs 1 scenario_tests::scenarios::tests
        env:
          RUST_MIN_STACK: 8388608


  rust-build-and-test-roaming:
    name: Build and Test Roaming Feature
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Install Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y libdbus-1-dev gnome-keyring libxcb1-dev

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: roaming

      - name: Build and Test with roaming
        run: |
          gnome-keyring-daemon --components=secrets --daemonize --unlock <<< 'foobar'
          export CARGO_INCREMENTAL=0
          cargo test -p goose-roaming
          cargo build -p goose-cli --features roaming
          cargo test -p goose-cli --features roaming --test roam_acp_client
        env:
          RUST_MIN_STACK: 8388608

  rust-check-onprem:
    name: Check On-Prem Build Variant
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Install Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y libdbus-1-dev gnome-keyring libxcb1-dev cmake golang-go

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: onprem

      - name: Verify FIPS module version pin
        # FIPS 140-3 validation is version-specific (AWS-LC FIPS module cert
        # #4816 covers the validated build configuration). A dependency bump
        # that changes aws-lc-fips-sys must be a deliberate, reviewed decision,
        # not a silent `cargo update` side effect.
        run: |
          EXPECTED="0.14.2"
          ACTUAL=$(grep -A1 'name = "aws-lc-fips-sys"' Cargo.lock | grep '^version' | cut -d'"' -f2)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::aws-lc-fips-sys version pin mismatch: expected $EXPECTED, found $ACTUAL."
            echo "::error::FIPS 140-3 validation is version-specific; update EXPECTED deliberately after review."
            exit 1
          fi
          echo "FIPS module version pin OK: aws-lc-fips-sys $ACTUAL"

      - name: Check and lint on-prem feature build
        # Mirror the feature set of the "Build and Test TLS Backend" jobs (a
        # known-good configuration) plus onprem, and add nostr + otel so the
        # onprem-gated code in nostr_share.rs, langfuse_layer.rs and logging.rs
        # is compiled too.
        run: |
          export CARGO_INCREMENTAL=0
          cargo check -p goose-providers --features onprem,rustls-tls --all-targets
          cargo check -p warmachine --no-default-features --features onprem,rustls-tls,code-mode,tree-sitter,live-voice,scheduler,platform-apps,chat-recall,acp-http,nostr,otel --all-targets
          cargo check -p goose-cli --features onprem --all-targets
          cargo clippy -p warmachine --no-default-features --features onprem,rustls-tls,code-mode,tree-sitter,live-voice,scheduler,platform-apps,chat-recall,acp-http,nostr,otel --all-targets -- -D warnings
        env:
          WARMACHINE_ONPREM_BASE_URL: "https://llm.internal.example/v1"
          RUST_MIN_STACK: 8388608

      - name: Run on-prem sandbox egress tests
        # The allowlist unit tests and the egress sandbox integration test
        # only compile with the onprem feature and a base URL baked in.
        # These prove the network sandbox refuses exfiltration: public clouds,
        # plaintext HTTP, and allowlist bypass attempts are all refused, and
        # ApiClient cannot be constructed for a non-allowlisted host.
        # The FIPS test proves the validated crypto provider actually activates
        # at runtime (power-on self-tests pass), not just that it compiles.
        run: |
          export CARGO_INCREMENTAL=0
          cargo test -p goose-providers --features onprem,rustls-tls --test onprem_egress_sandbox
          cargo test -p goose-providers --features onprem,rustls-tls --lib onprem
          cargo test -p warmachine --no-default-features --features onprem,rustls-tls,code-mode,tree-sitter,live-voice,scheduler,platform-apps,chat-recall,acp-http,nostr,otel --test onprem_fips
          cargo test -p warmachine --no-default-features --features onprem,rustls-tls,code-mode,tree-sitter,live-voice,scheduler,platform-apps,chat-recall,acp-http,nostr,otel --test onprem_audit_forward
        env:
          WARMACHINE_ONPREM_BASE_URL: "https://llm.internal.example/v1"
          RUST_MIN_STACK: 8388608

  onprem-sbom:
    name: Generate On-Prem SBOM (CycloneDX)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Install Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y cmake golang-go

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: Generate CycloneDX SBOM for the on-prem build
        # Same feature set as the on-prem check job, so the SBOM reflects the
        # exact dependency tree of the DoD build variant.
        # Note: cargo-cyclonedx takes --manifest-path, not -p.
        run: |
          export CARGO_INCREMENTAL=0
          cargo cyclonedx --format json \
            --manifest-path crates/goose/Cargo.toml --no-default-features \
            -F onprem,rustls-tls,code-mode,tree-sitter,live-voice,scheduler,platform-apps,chat-recall,acp-http,nostr,otel
          cargo cyclonedx --format json \
            --manifest-path crates/goose-cli/Cargo.toml -F onprem
        env:
          WARMACHINE_ONPREM_BASE_URL: "https://llm.internal.example/v1"

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: onprem-sbom-cyclonedx
          path: |
            crates/goose/warmachine.cdx.json
            crates/goose-cli/goose-cli.cdx.json
          retention-days: 90

  cargo-deny:
    name: Vulnerability Scan (cargo-deny)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Check advisories, bans, licenses, sources
        # deny.toml is the policy: RUSTSEC advisories and yanked crates are
        # deny-by-default (NIST 800-171 3.14.1 flaw remediation). Every ignore
        # in deny.toml carries a justification comment.
        run: cargo deny check

  rust-build-windows:
    name: Build Rust Project on Windows
    runs-on: windows-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: windows-ci

      - name: Setup Rust
        shell: bash
        run: |
          rustup show
          rustup target add x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --target x86_64-pc-windows-msvc
        env:
          CARGO_INCREMENTAL: "0"

  rust-msrv:
    name: Check MSRV
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ -z "$msrv" ]; then
            echo "Could not find rust-version in workspace Cargo.toml" >&2
            exit 1
          fi
          echo "msrv=$msrv" >> "$GITHUB_OUTPUT"
          echo "MSRV: $msrv"

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f  # v2.0.0
        with:
          toolchain: ${{ steps.msrv.outputs.msrv }}

      - name: Install Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y libdbus-1-dev libxcb1-dev

      - name: Repair stale v8 prebuilt marker
        run: .github/scripts/repair-v8-prebuilt.sh

      - name: Check with MSRV toolchain
        run: cargo check --workspace --locked --all-targets
        env:
          CARGO_INCREMENTAL: "0"
          RUSTFLAGS: "-D warnings"

  rust-lint:
    name: Lint Rust Code
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Repair stale v8 prebuilt marker
        run: .github/scripts/repair-v8-prebuilt.sh

      - name: Lint
        run: |
          source ./bin/activate-hermit
          # use the non-hermit rust toolchain because the rust-cache action does not
          # play nicely with hermit-managed rust
          hermit uninstall rustup
          export CARGO_INCREMENTAL=0
          cargo clippy --workspace --all-targets --exclude v8 -- -D warnings

  schema-check:
    name: Check Generated Schemas are Up-to-Date
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Install Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y libdbus-1-dev libxcb1-dev

      - name: Install Node.js Dependencies
        run: |
          source ./bin/activate-hermit
          cd ui/desktop && pnpm install --frozen-lockfile

      - name: Check ACP Artifacts are Up-to-Date
        run: |
          source ./bin/activate-hermit
          just check-acp-artifacts

      - name: Check ACP Client SDK
        run: |
          source ./bin/activate-hermit
          cd ui/goose-acp-client
          pnpm run lint

  gdk-release-config-check:
    name: Check GDK Release Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check GDK crate membership and publication order
        run: python3 crates/goose-sdk/scripts/gdk-release.py check-config

  gdk-api-docs-check:
    name: Check GDK API Reference is Up-to-Date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check generated GDK API reference data
        run: python3 documentation/automation/gdk-api/generate.py --check

  desktop-lint:
    name: Test and Lint Electron Desktop App
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Dependencies
        run: source ../../bin/activate-hermit && pnpm install --frozen-lockfile
        working-directory: ui/desktop

      - name: Run Lint
        run: source ../../bin/activate-hermit && pnpm run lint:check
        working-directory: ui/desktop

      - name: Run Tests
        run: source ../../bin/activate-hermit && pnpm run test:run
        working-directory: ui/desktop

      - name: Test macOS update manifests
        run: source ../../bin/activate-hermit && node --test scripts/mac-update-requirements.test.cjs
        working-directory: ui/desktop

  desktop-updater-install:
    name: Test Desktop Updater Install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24.10.0

      - name: Install pnpm
        run: npm install -g pnpm@10.30.3

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ui/desktop

      - name: Run Updater Install Test
        run: pnpm exec vitest run src/utils/githubUpdater.install.test.ts
        working-directory: ui/desktop
