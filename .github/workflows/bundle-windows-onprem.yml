name: "Bundle On-Prem CLI and Desktop (Windows)"

# On-prem Windows desktop: warmachine.exe built with the `onprem` cargo
# feature (endpoint baked in at compile time, cannot be disabled) bundled
# into the Electron app, packaged as a Squirrel installer.
#
# Trigger manually: Actions -> "Bundle On-Prem CLI and Desktop (Windows)" ->
# "Run workflow", entering the internal LLM server URL. The URL is baked into
# the binary at compile time (WARMACHINE_ONPREM_BASE_URL env!).
#
# The desktop UI is built with WARMACHINE_DESKTOP_ONPREM=1, which disables the
# plaintext localStorage prompt history (memory-only) at build time.

on:
  workflow_dispatch:
    inputs:
      onprem_base_url:
        description: 'On-prem LLM server base URL, baked into the binary at compile time (e.g. https://llm.internal.example/v1)'
        required: true
        type: string
      signing:
        description: 'Whether to sign the Windows installer (needs the signing environment)'
        required: false
        type: boolean
        default: false
      package_desktop:
        description: 'Whether to package and upload the Desktop installer'
        required: false
        type: boolean
        default: true
      environment:
        description: 'GitHub Environment containing signing secrets. Leave empty for unsigned builds.'
        required: false
        type: string
        default: ''
      ref:
        description: 'Git ref to checkout'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build-onprem-windows:
    name: Build WarMachine on-prem (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || '' }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: windows-msvc-desktop-onprem

      - name: Setup Rust
        shell: bash
        run: |
          rustup show
          rustup target add x86_64-pc-windows-msvc

      - name: Build on-prem Windows executable
        shell: pwsh
        env:
          WARMACHINE_ONPREM_BASE_URL: ${{ inputs.onprem_base_url }}
        run: |
          cargo build --release --target x86_64-pc-windows-msvc -p goose-cli --bin warmachine --features onprem

          $binaryPath = "./target/x86_64-pc-windows-msvc/release/warmachine.exe"
          if (-not (Test-Path $binaryPath)) {
            Write-Error "Windows binary not found: $binaryPath"
            Get-ChildItem ./target/x86_64-pc-windows-msvc/release/ -ErrorAction SilentlyContinue
            exit 1
          }
          Get-Item $binaryPath

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: internal-warmachine-onprem-x86_64-pc-windows-msvc
          path: target/x86_64-pc-windows-msvc/release/warmachine.exe
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  build-desktop-onprem-windows:
    name: Build On-Prem Desktop (Windows)
    if: ${{ inputs.package_desktop }}
    needs: build-onprem-windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || '' }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24.10.0

      - name: Install pnpm
        run: npm install -g pnpm@10.30.3

      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            node_modules
            ui/desktop/node_modules
            .hermit/node/cache
          key: windows-pnpm-cache-v1-${{ runner.os }}-node24-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            windows-pnpm-cache-v1-${{ runner.os }}-node24-

      - name: Download on-prem binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: internal-warmachine-onprem-x86_64-pc-windows-msvc
          path: backend

      - name: Prepare Windows binary
        shell: bash
        run: |
          rm -rf ./ui/desktop/src/bin
          mkdir -p ./ui/desktop/src/bin
          cp -f ./backend/warmachine.exe ./ui/desktop/src/bin/

          if [ -d "./ui/desktop/src/platform/windows/bin" ]; then
            for file in ./ui/desktop/src/platform/windows/bin/*.{exe,dll,cmd}; do
              filename="$(basename "$file")"
              if [ -f "$file" ] && [ "$filename" != "warmachine.exe" ]; then
                cp -f "$file" ./ui/desktop/src/bin/
              fi
            done

            if [ -d "./ui/desktop/src/platform/windows/bin/goose-npm" ]; then
              cp -r ./ui/desktop/src/platform/windows/bin/goose-npm/ ./ui/desktop/src/bin/goose-npm/
            fi
          fi

      - name: Force GitHub HTTPS for npm git dependencies
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "git+ssh://git@github.com/"

      - name: Build on-prem desktop UI with pnpm
        shell: bash
        env:
          ELECTRON_PLATFORM: win32
          # Baked into the renderer at build time: disables plaintext
          # localStorage prompt history (memory-only) in the on-prem variant.
          WARMACHINE_DESKTOP_ONPREM: '1'
          # Opt into the Squirrel installer maker (standard pipeline keeps zip).
          WARMACHINE_DESKTOP_INSTALLER: squirrel
        run: |
          cd ui/desktop
          pnpm install --frozen-lockfile
          node scripts/build-main.js
          node scripts/prepare-platform-binaries.js
          pnpm run make --platform=win32 --arch=x64

      - name: List installer output
        shell: bash
        run: |
          ls -la ./ui/desktop/out/make/squirrel.windows/x64/

      - name: Upload unsigned installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: warmachine-onprem-windows-installer-unsigned
          path: ui/desktop/out/make/squirrel.windows/x64/
          if-no-files-found: error
          overwrite: true

  sign-desktop-onprem-windows:
    name: Sign On-Prem Desktop (Windows)
    needs: build-desktop-onprem-windows
    if: ${{ inputs.package_desktop && inputs.signing }}
    runs-on: windows-latest
    environment: ${{ inputs.environment || '' }}
    permissions:
      id-token: write
    steps:
      - name: Download unsigned installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: warmachine-onprem-windows-installer-unsigned
          path: installer

      - name: Azure login
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c  # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows installer with Azure Trusted Signing
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82  # v2.0.0
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files: |
            ${{ github.workspace }}/installer/WarMachineSetup.exe

      - name: Verify signed installer
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "installer/WarMachineSetup.exe"
          if ($sig.Status -ne "Valid") { throw "Signature invalid: $($sig.Status)" }
          Write-Output "Signature valid"

      - name: Upload signed installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: warmachine-onprem-windows-installer
          path: installer/
          if-no-files-found: error
          overwrite: true
